<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPano 全景编辑器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #1a1c20;
            --panel: #23262c;
            --panel2: #2a2e36;
            --border: #3a3f49;
            --text: #e8eaed;
            --text-dim: #9aa0aa;
            --accent: #4f8cff;
            --danger: #e5534b;
            --ok: #3fb950;
        }

        html, body { width: 100%; height: 100%; overflow: hidden; }

        body {
            display: flex;
            background: var(--bg);
            color: var(--text);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            font-size: 14px;
        }

        /* ===== 侧栏 ===== */
        #side {
            width: 300px;
            min-width: 300px;
            height: 100%;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #side .logo {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 16px;
            font-weight: bold;
        }
        #side .logo span { color: var(--accent); }

        .sec {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            overflow-y: auto;
        }
        .sec h3 {
            font-size: 12px;
            color: var(--text-dim);
            font-weight: normal;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .btn {
            display: inline-block;
            background: var(--panel2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 12px;
            cursor: pointer;
            font-size: 13px;
            transition: all .15s;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn.primary:hover { opacity: .85; color: #fff; }
        .btn.danger { color: var(--danger); }
        .btn.danger:hover { border-color: var(--danger); }
        .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

        .sec input[type=number] {
            width: 86px;
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 7px 8px;
            font-size: 13px;
            outline: none;
        }
        .sec input[type=number]:focus { border-color: var(--accent); }

        /* 照片列表 */
        .photo-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 6px;
            background: var(--panel2);
            border: 1px solid transparent;
        }
        .photo-item:hover { border-color: var(--border); }
        .photo-item.current { border-color: var(--accent); }
        .photo-item .thumb {
            width: 46px; height: 30px;
            border-radius: 4px;
            object-fit: cover;
            background: #000;
            flex-shrink: 0;
        }
        .photo-item .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .photo-item .del {
            color: var(--text-dim);
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .photo-item .del:hover { color: var(--danger); background: rgba(229,83,75,.15); }

        /* 热点列表 */
        .hs-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 6px;
            background: var(--panel2);
            margin-bottom: 6px;
            font-size: 13px;
        }
        .hs-item img { width: 22px; height: 22px; border-radius: 4px; }
        .hs-item .info { flex: 1; overflow: hidden; }
        .hs-item .info .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .hs-item .info .c { color: var(--text-dim); font-size: 11px; }
        .hs-item .del { color: var(--text-dim); cursor: pointer; padding: 2px 6px; border-radius: 4px; }
        .hs-item .del:hover { color: var(--danger); background: rgba(229,83,75,.15); }

        .tip { color: var(--text-dim); font-size: 12px; line-height: 1.7; margin-top: 8px; }
        .coord { color: var(--accent); font-size: 12px; font-family: Consolas, monospace; margin-top: 6px; min-height: 16px; }

        /* ===== 画布区 ===== */
        #stage { flex: 1; position: relative; height: 100%; }
        #pano { width: 100%; height: 100%; }

        #pano-mode-tip {
            position: absolute;
            top: 14px; left: 50%;
            transform: translateX(-50%);
            background: rgba(79,140,255,.9);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            display: none;
            z-index: 10;
            pointer-events: none;
        }

        /* ===== 弹窗 ===== */
        #mask {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #mask.show { display: flex; }
        #modal {
            width: 360px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }
        #modal h3 { margin-bottom: 16px; font-size: 15px; }
        #modal .field { margin-bottom: 14px; }
        #modal label { display: block; color: var(--text-dim); font-size: 12px; margin-bottom: 6px; }
        #modal select, #modal input[type=text] {
            width: 100%;
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 8px 10px;
            font-size: 13px;
            outline: none;
        }
        #modal select:focus, #modal input:focus { border-color: var(--accent); }
        .icon-grid { display: flex; gap: 8px; flex-wrap: wrap; }
        .icon-opt {
            width: 52px; height: 52px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel2);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .icon-opt img { width: 30px; height: 30px; object-fit: contain; }
        .icon-opt.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
        #modal .foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

        /* toast */
        #toast {
            position: fixed;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: rgba(30,32,38,.95);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 200;
            display: none;
        }

        /* ===== 预览模式 ===== */
        body.preview #side { display: none; }
        body.preview #exit-preview {
            display: block;
        }
        #exit-preview {
            display: none;
            position: absolute;
            top: 14px; left: 14px;
            z-index: 10;
        }
    </style>
</head>

<body>
    <!-- ===== 侧栏 ===== -->
    <div id="side">
        <div class="logo">TPano <span>全景编辑器</span></div>

        <!-- 全景照片 -->
        <div class="sec">
            <h3>全景照片</h3>
            <div class="btn-row" style="margin-bottom:10px">
                <button class="btn primary" id="btn-add-photo">＋ 添加全景图</button>
            </div>
            <input type="file" id="file-input" accept="image/*,video/mp4,video/webm" multiple style="display:none">
            <div id="photo-list"></div>
            <div class="tip" style="margin-top:10px">当前照片视野 FOV（文档提示：设置不当会黑屏或边缘严重变形，推荐 PC 60 / 手机 90）</div>
            <div class="btn-row" style="margin-top:6px">
                <input type="number" id="fov-pc" min="30" max="110" placeholder="PC 视野角">
                <input type="number" id="fov-phone" min="30" max="110" placeholder="手机视野角">
                <button class="btn" id="btn-fov">应用</button>
            </div>
            <div class="tip">点击列表项切换查看；「添加热点」模式下点击全景图即可放置热点。</div>
        </div>

        <!-- 热点编辑 -->
        <div class="sec">
            <h3>热点</h3>
            <div class="btn-row" style="margin-bottom:10px">
                <button class="btn" id="btn-add-hs">📍 添加热点</button>
            </div>
            <div class="coord" id="coord-tip"></div>
            <div id="hs-list"></div>
        </div>

        <!-- 导入导出 -->
        <div class="sec" style="flex:1">
            <h3>配置</h3>
            <div class="btn-row">
                <button class="btn" id="btn-export">导出 JSON</button>
                <button class="btn" id="btn-import">导入 JSON</button>
                <button class="btn" id="btn-export-html">导出展示页</button>
            </div>
            <input type="file" id="json-input" accept=".json" style="display:none">
            <div class="tip">
                · 配置会自动保存到浏览器，刷新不丢失<br>
                · 本地选择的图片刷新后需重新添加<br>
                · 「导出展示页」生成单文件 HTML，脚本和图片全部内嵌，发给任何人双击即可打开
            </div>
        </div>
    </div>

    <!-- ===== 画布 ===== -->
    <div id="stage">
        <div id="pano"></div>
        <div id="pano-mode-tip">添加热点模式：在全景图上点击要放置热点的位置</div>
        <button class="btn" id="exit-preview">← 退出预览</button>
    </div>

    <!-- ===== 热点弹窗 ===== -->
    <div id="mask">
        <div id="modal">
            <h3>设置热点</h3>
            <div class="field">
                <label>跳转目标（点击热点后切换到的全景图）</label>
                <select id="m-jump"></select>
            </div>
            <div class="field">
                <label>热点图标</label>
                <div class="icon-grid" id="m-icons"></div>
            </div>
            <div class="field" id="m-custom-wrap" style="display:none">
                <label>自定义图标 URL</label>
                <input type="text" id="m-custom" placeholder="https://... 或 ./path/icon.png">
            </div>
            <div class="foot">
                <button class="btn" id="m-cancel">取消</button>
                <button class="btn primary" id="m-ok">确定添加</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script src="./example/three.js"></script>
    <script src="./dist/tpano.js"></script>
    <script src="./example/DeviceOrientationControls.js"></script>
    <script>
        //==================== 状态 ====================
        var photos = [];      // {name, url, isBlob}
        var hotspots = [];    // {source, position:{x,y,z}, imgUrl, jumpTo}
        var currentIdx = 0;
        var pendingSwitch = null; // 等全部照片加载完后再切换到的目标索引
        var tpano = null;
        var addMode = false;          // 添加热点模式
        var pendingPoint = null;      // 待确认的坐标

        var ICONS = [
            './example/img/foot.png',
            './example/img/outdoor.gif',
            './example/img/bar/photo.png',
            './example/img/bar/gyro.png'
        ];

        //==================== 工具 ====================
        function $(id) { return document.getElementById(id); }
        function toast(msg) {
            var t = $('toast');
            t.textContent = msg;
            t.style.display = 'block';
            clearTimeout(t._timer);
            t._timer = setTimeout(function () { t.style.display = 'none'; }, 2200);
        }
        function thumbOf(url) {
            return url.toLowerCase().match(/\.(gif|jfif)$/) ? url : url;
        }

        //==================== TPano 初始化 / 重建 ====================
        function buildConfig() {
            return {
                el: 'pano',
                photo: photos.map(function (p) {
                    var item = { url: p.url, name: p.name };
                    if (p.isVideo) item.type = 'VIDEO';
                    if (p.fov) item.fov = p.fov;
                    return item;
                }),
                hotspot: hotspots.slice(),
                MouseController: true,
                rotateAnimateController: false,
                DeviceOrientationControls: false,
                debug: false,
                gyroSport: function () { }, // 兜底：避免开启体感时因未提供回调而报错
                positionClick: onPositionClick,
                switchLoad: function (e) {
                    if (e && e.loading) {
                        currentIdx = e.loading.id - 1;
                        renderPhotoList();
                        renderHsList();
                        updateFovInputs();
                    }
                },
                photoLoad: function (e) {
                    // 全部纹理加载完毕后，再执行重建前登记的目标切换，避免与加载过程竞态
                    if (e.Leftover === 0 && pendingSwitch != null) {
                        var t = pendingSwitch;
                        pendingSwitch = null;
                        if (t !== currentIdx && tpano) tpano.re.switchPhoto(t + 1);
                    }
                }
            };
        }

        function rebuild() {
            var el = $('pano');
            el.innerHTML = '';
            if (photos.length === 0) { tpano = null; return; }
            currentIdx = Math.min(currentIdx, photos.length - 1);
            // 并行预热浏览器缓存（tpano.js 内部串行加载，在限速链路上较慢）
            photos.forEach(function (p) {
                if (!p.isBlob) { var pre = new Image(); pre.src = p.url; }
            });
            // 若目标是当前首图则无需登记；否则等全部照片加载完由 photoLoad 回调切换
            pendingSwitch = currentIdx > 0 ? currentIdx : null;
            tpano = new TPano(buildConfig());
        }

        //==================== 点击坐标（打补丁后的回调） ====================
        function onPositionClick(point, object, intersects) {
            // 始终记录坐标显示
            $('coord-tip').textContent =
                'x: ' + point.x.toFixed(2) + '  y: ' + point.y.toFixed(2) + '  z: ' + point.z.toFixed(2);

            if (!addMode) return;
            // 取最外层球面交点（跳过热点精灵，避免取到贴片表面坐标）
            var spherePoint = point;
            for (var i = intersects.length - 1; i >= 0; i--) {
                if (intersects[i].object.name !== 'hotspot') {
                    spherePoint = intersects[i].point;
                    break;
                }
            }
            pendingPoint = { x: spherePoint.x, y: spherePoint.y, z: spherePoint.z };
            openModal();
        }

        //==================== 照片管理 ====================
        $('btn-add-photo').onclick = function () { $('file-input').click(); };
        $('file-input').onchange = function () {
            var files = Array.prototype.slice.call(this.files);
            if (!files.length) return;
            var firstNew = photos.length; // 新增照片的起始索引
            files.forEach(function (f) {
                var isVideo = f.type.indexOf('video') === 0;
                photos.push({
                    name: f.name.replace(/\.[^.]+$/, ''),
                    url: URL.createObjectURL(f),
                    isBlob: true,
                    isVideo: isVideo,
                    size: f.size,
                    fov: null
                });
            });
            this.value = '';
            // 必须重建 TPano 实例：其内部持有创建时的照片数组，直接追加会触发"无效的照片索引"
            currentIdx = firstNew;
            rebuild();
            save();
            var hasVideo = files.some(function (f) { return f.type.indexOf('video') === 0; });
            toast('已添加 ' + files.length + ' 个全景项目' + (hasVideo ? '（含全景视频）' : ''));
        };

        function renderPhotoList() {
            var box = $('photo-list');
            box.innerHTML = '';
            photos.forEach(function (p, i) {
                var div = document.createElement('div');
                div.className = 'photo-item' + (i === currentIdx ? ' current' : '');
                var img = document.createElement('img');
                img.className = 'thumb';
                img.src = p.isVideo ? './example/video.png' : p.url;
                var name = document.createElement('div');
                name.className = 'name';
                name.textContent = p.name;
                var del = document.createElement('div');
                del.className = 'del';
                del.textContent = '✕';
                del.title = '删除';
                del.onclick = function (e) {
                    e.stopPropagation();
                    if (!confirm('确定删除全景图「' + p.name + '」？其关联热点也会一并删除。')) return;
                    var name = p.name;
                    photos.splice(i, 1);
                    hotspots = hotspots.filter(function (h) {
                        return h.source !== name && h.jumpTo !== name;
                    });
                    if (currentIdx >= photos.length) currentIdx = Math.max(0, photos.length - 1);
                    rebuild();
                    save();
                };
                div.appendChild(img); div.appendChild(name); div.appendChild(del);
                div.onclick = function () {
                    if (!tpano) return;
                    var r = tpano.re.switchPhoto(i + 1);
                    if (r.status !== 'OK') toast(r.msg || '切换失败');
                };
                box.appendChild(div);
            });
        }

        //==================== 热点管理 ====================
        $('btn-add-hs').onclick = function () {
            if (!tpano) { toast('请先添加全景图'); return; }
            addMode = !addMode;
            this.classList.toggle('active', addMode);
            $('pano-mode-tip').style.display = addMode ? 'block' : 'none';
            if (!addMode) $('coord-tip').textContent = '';
        };

        function renderHsList() {
            var box = $('hs-list');
            box.innerHTML = '';
            var cur = photos[currentIdx] ? photos[currentIdx].name : '';
            hotspots.forEach(function (h, i) {
                if (h.source !== cur) return;
                var div = document.createElement('div');
                div.className = 'hs-item';
                var img = document.createElement('img');
                img.src = h.imgUrl;
                var info = document.createElement('div');
                info.className = 'info';
                info.innerHTML = '<div class="t">' + (h.jumpTo ? '→ ' + h.jumpTo : '信息点') + '</div>' +
                    '<div class="c">(' + h.position.x.toFixed(0) + ', ' + h.position.y.toFixed(0) + ', ' + h.position.z.toFixed(0) + ')</div>';
                var del = document.createElement('div');
                del.className = 'del';
                del.textContent = '✕';
                del.onclick = function () {
                    hotspots.splice(i, 1);
                    refreshHotspots();
                    save();
                };
                div.appendChild(img); div.appendChild(info); div.appendChild(del);
                box.appendChild(div);
            });
            if (!box.children.length) {
                box.innerHTML = '<div class="tip">当前照片暂无热点</div>';
            }
        }

        function refreshHotspots() {
            // 重新执行当前照片的切换逻辑即可重绘热点
            if (tpano) tpano.re.switchPhoto(currentIdx + 1);
            renderHsList();
        }

        //==================== 视野 FOV 设置（文档：为单张设置相机视野） ====================
        function updateFovInputs() {
            var p = photos[currentIdx];
            $('fov-pc').value = p && p.fov && p.fov.pc != null ? p.fov.pc : '';
            $('fov-phone').value = p && p.fov && p.fov.phone != null ? p.fov.phone : '';
        }

        $('btn-fov').onclick = function () {
            if (!tpano || !photos[currentIdx]) { toast('请先添加全景图'); return; }
            var pc = parseFloat($('fov-pc').value);
            var ph = parseFloat($('fov-phone').value);
            var fov = {};
            if (!isNaN(pc)) fov.pc = THREE.MathUtils.clamp(pc, 30, 110);
            if (!isNaN(ph)) fov.phone = THREE.MathUtils.clamp(ph, 30, 110);
            photos[currentIdx].fov = (fov.pc != null || fov.phone != null) ? fov : null;
            // fov 仅在切换照片时生效，重新执行当前照片的切换以应用
            tpano.re.switchPhoto(currentIdx + 1);
            save();
            toast('视野已应用：PC ' + (fov.pc != null ? fov.pc : '默认') + ' / 手机 ' + (fov.phone != null ? fov.phone : '默认'));
        };

        //==================== 热点弹窗 ====================
        var selIcon = ICONS[0];

        function openModal() {
            // 填充跳转目标
            var sel = $('m-jump');
            sel.innerHTML = '<option value="">（不跳转 · 信息点）</option>';
            photos.forEach(function (p) {
                if (p.name !== photos[currentIdx].name) {
                    sel.innerHTML += '<option value="' + p.name + '">跳转到「' + p.name + '」</option>';
                }
            });
            // 填充图标
            var grid = $('m-icons');
            grid.innerHTML = '';
            ICONS.forEach(function (u) {
                var d = document.createElement('div');
                d.className = 'icon-opt' + (u === selIcon ? ' sel' : '');
                d.innerHTML = '<img src="' + u + '">';
                d.onclick = function () {
                    selIcon = u;
                    $('m-custom-wrap').style.display = 'none';
                    Array.prototype.forEach.call(grid.children, function (c) { c.classList.remove('sel'); });
                    d.classList.add('sel');
                };
                grid.appendChild(d);
            });
            // 自定义图标选项
            var custom = document.createElement('div');
            custom.className = 'icon-opt';
            custom.textContent = '自定义';
            custom.style.fontSize = '11px';
            custom.onclick = function () {
                Array.prototype.forEach.call(grid.children, function (c) { c.classList.remove('sel'); });
                custom.classList.add('sel');
                $('m-custom-wrap').style.display = 'block';
                selIcon = 'custom';
            };
            grid.appendChild(custom);

            $('mask').classList.add('show');
        }

        $('m-cancel').onclick = closeModal;
        function closeModal() {
            $('mask').classList.remove('show');
            pendingPoint = null;
        }

        $('m-ok').onclick = function () {
            if (!pendingPoint) return closeModal();
            var imgUrl = selIcon === 'custom' ? $('m-custom').value.trim() : selIcon;
            if (!imgUrl) { toast('请填写图标地址'); return; }
            var jumpTo = $('m-jump').value || null;
            hotspots.push({
                source: photos[currentIdx].name,
                position: pendingPoint,
                imgUrl: imgUrl,
                jumpTo: jumpTo
            });
            closeModal();
            refreshHotspots();
            save();
            toast('热点已添加');
        };

        //==================== 导入 / 导出 ====================
        // 把任意图片地址（blob: / 相对路径 / http）转成可独立打开的 data URL；失败时原样返回
        function toDataURL(url) {
            return fetch(url).then(function (r) {
                if (!r.ok) throw new Error('bad');
                return r.blob();
            }).then(function (blob) {
                return new Promise(function (res, rej) {
                    var fr = new FileReader();
                    fr.onload = function () { res(fr.result); };
                    fr.onerror = rej;
                    fr.readAsDataURL(blob);
                });
            }).catch(function () { return url; });
        }

        // 防止脚本或配置内容里出现 script 结束标签，导致内联脚本被提前截断
        function safeEmbed(s) {
            return s.replace(/<\/(script)/gi, '<\\/$1');
        }

        $('btn-export').onclick = async function () {
            if (!photos.length) { toast('请先添加全景图'); return; }
            toast('正在导出（本地图片转为 base64）...');
            var ph = [], hs = [], i;
            for (i = 0; i < photos.length; i++) {
                var item = { name: photos[i].name, url: await toDataURL(photos[i].url) };
                if (photos[i].isVideo) item.type = 'VIDEO';
                if (photos[i].fov) item.fov = photos[i].fov;
                ph.push(item);
            }
            for (i = 0; i < hotspots.length; i++) {
                hs.push({
                    source: hotspots[i].source,
                    position: hotspots[i].position,
                    imgUrl: await toDataURL(hotspots[i].imgUrl),
                    jumpTo: hotspots[i].jumpTo
                });
            }
            download('tpano-config.json', JSON.stringify({ photo: ph, hotspot: hs }, null, 2));
            toast('配置已导出（已内嵌媒体数据）');
        };

        $('btn-import').onclick = function () { $('json-input').click(); };
        $('json-input').onchange = function () {
            var f = this.files[0];
            if (!f) return;
            var reader = new FileReader();
            reader.onload = function () {
                try {
                    var cfg = JSON.parse(reader.result);
                    var ph = cfg.photo || cfg.photos || [];
                    photos = ph.filter(function (p) { return p.url && p.url.indexOf('blob:') !== 0; })
                        .map(function (p) {
                            return { name: p.name, url: p.url, isBlob: false, isVideo: p.type === 'VIDEO', fov: p.fov || null };
                        });
                    hotspots = cfg.hotspot || [];
                    currentIdx = 0;
                    rebuild();
                    save();
                    toast('导入成功：' + photos.length + ' 张照片，' + hotspots.length + ' 个热点（blob 本地图已跳过）');
                } catch (e) {
                    toast('JSON 解析失败：' + e.message);
                }
            };
            reader.readAsText(f);
            this.value = '';
        };

        // 导出单文件自包含展示页（脚本与图片全部内嵌，双击即可打开）
        $('btn-export-html').onclick = async function () {
            if (!photos.length) { toast('请先添加全景图'); return; }
            toast('正在打包（脚本与图片内嵌，大图会稍慢）...');
            try {
                // 1. 内联三个脚本
                var scripts = ['./example/three.js', './dist/tpano.js', './example/DeviceOrientationControls.js'];
                var texts = [];
                for (var i = 0; i < scripts.length; i++) {
                    var r = await fetch(scripts[i]);
                    if (!r.ok) throw new Error('脚本获取失败: ' + scripts[i]);
                    texts.push(await r.text());
                }
                // 2. 媒体转 data URL
                var totalSize = photos.reduce(function (s, p) { return s + (p.size || 0); }, 0);
                var photoCfg = [];
                for (var j = 0; j < photos.length; j++) {
                    var item = { url: await toDataURL(photos[j].url), name: photos[j].name };
                    if (photos[j].isVideo) item.type = 'VIDEO';
                    if (photos[j].fov) item.fov = photos[j].fov;
                    photoCfg.push(item);
                }
                var hsCfg = [];
                for (var k = 0; k < hotspots.length; k++) {
                    var h = hotspots[k];
                    var item = { source: h.source, position: h.position, imgUrl: await toDataURL(h.imgUrl) };
                    if (h.jumpTo) item.jumpTo = h.jumpTo;
                    hsCfg.push(item);
                }
                var cfg = { el: 'pano', photo: photoCfg, hotspot: hsCfg, rotateAnimateController: true };
                // 3. 组装单文件 HTML
                var cfgJson = JSON.stringify(cfg).replace(/<\//g, '<\\/');
                var html = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n'
                    + '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n'
                    + '<title>TPano 全景漫游</title>\n<style>*{margin:0}#pano{width:100vw;height:100vh}</style>\n</head>\n'
                    + '<body id="pano"></body>\n'
                    + '<script>\n' + safeEmbed(texts[0]) + '\n<\/script>\n'
                    + '<script>\n' + safeEmbed(texts[1]) + '\n<\/script>\n'
                    + '<script>\n' + safeEmbed(texts[2]) + '\n<\/script>\n'
                    + '<script>\nvar tpano = new TPano(' + cfgJson + ');\n<\/script>\n</html>';
                download('tpano-viewer.html', html);
                toast('单文件展示页已导出（' + Math.round(totalSize / 1048576) + 'MB 媒体已内嵌），双击即可打开');
            } catch (e) {
                toast('导出失败：' + e.message);
            }
        };

        function download(filename, content) {
            var a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([content], { type: 'application/octet-stream' }));
            a.download = filename;
            a.click();
        }

        //==================== 预览模式 ====================
        $('exit-preview').onclick = function () { setPreview(false); };
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                if ($('mask').classList.contains('show')) closeModal();
                else if (document.body.classList.contains('preview')) setPreview(false);
            }
        });
        // 双击画布进入预览
        $('pano').addEventListener('dblclick', function () { setPreview(true); });
        function setPreview(on) {
            document.body.classList.toggle('preview', on);
            if (on) {
                addMode = false;
                $('btn-add-hs').classList.remove('active');
                $('pano-mode-tip').style.display = 'none';
                toast('预览模式：按 Esc 或点击左上角退出');
            }
        }

        //==================== 自动保存 / 恢复 ====================
        function save() {
            try {
                localStorage.setItem('tpano-editor-v2', JSON.stringify({
                    photos: photos.map(function (p) {
                        return {
                            name: p.name,
                            url: p.isBlob ? '' : p.url,
                            isVideo: !!p.isVideo,
                            fov: p.fov || null
                        };
                    }),
                    hotspots: hotspots
                }));
            } catch (e) { }
        }
        (function restore() {
            try {
                var s = JSON.parse(localStorage.getItem('tpano-editor-v2') || 'null');
                if (s && s.photos && s.photos.length) {
                    photos = s.photos.filter(function (p) { return p.url; })
                        .map(function (p) {
                            return { name: p.name, url: p.url, isBlob: false, isVideo: !!p.isVideo, fov: p.fov || null };
                        });
                    hotspots = s.hotspots || [];
                }
            } catch (e) { }
            // 首次使用时预置示例全景图（panorama_2x1.jpg 为用户实测可用的 2:1 球面全景）
            if (!photos.length) {
                photos = [
                    { name: '办公区', url: './panorama_2x1.jpg', isBlob: false },
                    { name: '示例一', url: './example/pano/DSCN0007.JPG', isBlob: false },
                    { name: '示例二', url: './example/pano/DSCN0009.JPG', isBlob: false },
                    { name: '示例三', url: './example/pano/DSCN0013.JPG', isBlob: false }
                ];
            }
            rebuild();
        })();

        // 自适应窗口
        window.addEventListener('resize', function () {
            if (tpano) {
                var el = $('pano');
                tpano.re.resizeRendererToDisplaySize(el.clientWidth, el.clientHeight);
            }
        });
        // 初始视野输入框
        updateFovInputs();
    </script>
</body>

</html>
