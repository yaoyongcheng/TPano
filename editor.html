<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPano 全景编辑器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #1a1c20;
            --panel: #23262c;
            --panel2: #2a2e36;
            --border: #3a3f49;
            --text: #e8eaed;
            --text-dim: #9aa0aa;
            --accent: #4f8cff;
            --danger: #e5534b;
            --ok: #3fb950;
        }

        html, body { width: 100%; height: 100%; overflow: hidden; }

        body {
            display: flex;
            background: var(--bg);
            color: var(--text);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            font-size: 14px;
        }

        /* ===== 侧栏 ===== */
        #side {
            width: 300px;
            min-width: 300px;
            height: 100%;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #side .logo {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 16px;
            font-weight: bold;
        }
        #side .logo span { color: var(--accent); }

        .sec {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            overflow-y: auto;
        }
        .sec h3 {
            font-size: 12px;
            color: var(--text-dim);
            font-weight: normal;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .btn {
            display: inline-block;
            background: var(--panel2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 12px;
            cursor: pointer;
            font-size: 13px;
            transition: all .15s;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn.primary:hover { opacity: .85; color: #fff; }
        .btn.danger { color: var(--danger); }
        .btn.danger:hover { border-color: var(--danger); }
        .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

        .sec input[type=number] {
            width: 86px;
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 7px 8px;
            font-size: 13px;
            outline: none;
        }
        .sec input[type=number]:focus { border-color: var(--accent); }

        /* 照片列表 */
        .photo-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 6px;
            background: var(--panel2);
            border: 1px solid transparent;
        }
        .photo-item:hover { border-color: var(--border); }
        .photo-item.current { border-color: var(--accent); }
        .photo-item .thumb {
            width: 46px; height: 30px;
            border-radius: 4px;
            object-fit: cover;
            background: #000;
            flex-shrink: 0;
        }
        .photo-item .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .photo-item .del {
            color: var(--text-dim);
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .photo-item .del:hover { color: var(--danger); background: rgba(229,83,75,.15); }

        /* 热点列表 */
        .hs-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 6px;
            background: var(--panel2);
            margin-bottom: 6px;
            font-size: 13px;
        }
        .hs-item img { width: 22px; height: 22px; border-radius: 4px; }
        .hs-item .info { flex: 1; overflow: hidden; }
        .hs-item .info .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .hs-item .info .c { color: var(--text-dim); font-size: 11px; }
        .hs-item .del { color: var(--text-dim); cursor: pointer; padding: 2px 6px; border-radius: 4px; }
        .hs-item .del:hover { color: var(--danger); background: rgba(229,83,75,.15); }

        .tip { color: var(--text-dim); font-size: 12px; line-height: 1.7; margin-top: 8px; }
        .coord { color: var(--accent); font-size: 12px; font-family: Consolas, monospace; margin-top: 6px; min-height: 16px; }

        /* ===== 画布区 ===== */
        #stage { flex: 1; position: relative; height: 100%; }
        #pano { width: 100%; height: 100%; }

        #pano-mode-tip {
            position: absolute;
            top: 14px; left: 50%;
            transform: translateX(-50%);
            background: rgba(79,140,255,.9);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            display: none;
            z-index: 10;
            pointer-events: none;
        }

        /* ===== 弹窗 ===== */
        #mask {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #mask.show { display: flex; }
        #modal {
            width: 360px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }
        #modal h3 { margin-bottom: 16px; font-size: 15px; }
        #modal .field { margin-bottom: 14px; }
        #modal label { display: block; color: var(--text-dim); font-size: 12px; margin-bottom: 6px; }
        #modal select, #modal input[type=text] {
            width: 100%;
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 8px 10px;
            font-size: 13px;
            outline: none;
        }
        #modal select:focus, #modal input:focus { border-color: var(--accent); }
        .icon-grid { display: flex; gap: 8px; flex-wrap: wrap; }
        .icon-opt {
            width: 52px; height: 52px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel2);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .icon-opt img { width: 30px; height: 30px; object-fit: contain; }
        .icon-opt.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
        #modal .foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

        /* toast */
        #toast {
            position: fixed;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: rgba(30,32,38,.95);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 200;
            display: none;
        }

        /* ===== 预览模式 ===== */
        body.preview #side { display: none; }
        body.preview #exit-preview {
            display: block;
        }
        #exit-preview {
            display: none;
            position: absolute;
            top: 14px; left: 14px;
            z-index: 10;
        }

        /* ===== 加载动画（同示例页 #load） ===== */
        #load {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(46, 46, 46, 0.5);
            top: 0; left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }
        #load-bar-k {
            width: 40%;
            height: 1px;
            background-color: #555555;
            transition: height .3s;
        }
        #load-bar-x {
            height: 3px;
            width: 0%;
            background-color: #ffffff;
            transition: width 15s linear;
            animation: initload 30s linear forwards;
        }
        @keyframes initload {
            from { width: 0%; }
            to { width: 95%; }
        }

        /* ===== 右侧悬浮功能栏（同示例页 #controller-y） ===== */
        #controller-y {
            position: absolute;
            bottom: 40px;
            right: 16px;
            display: flex;
            flex-direction: column;
            background-color: rgba(20, 20, 20, 0.4);
            border-radius: 50px;
            padding: 2px;
            overflow: hidden;
            width: 42px;
            height: 170px;
            transition: height .2s;
            z-index: 6;
        }
        #controller-y .item {
            background-color: #ffffff;
            border-radius: 50px;
            box-sizing: border-box;
            width: 36px;
            height: 36px;
            padding: 6px;
            margin: 3.2px;
            position: relative;
            cursor: pointer;
            transition: opacity .4s;
        }
        #controller-y .item > img { width: 100%; height: 100%; display: block; }
        #controller-y .point {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #00aeff;
            border-radius: 50px;
            right: 0;
            bottom: -2px;
            display: none;
        }
        #controller-y .item-s { position: absolute; bottom: 2px; }
        #controller-y.collapsed { height: 42px; }
        body.no-bar #controller-y { display: none; }

        /* ===== 底部相册栏（同示例页 #photo-box） ===== */
        #photo-box {
            position: absolute;
            width: 100%;
            padding: 8px 10px;
            left: 0; bottom: 0;
            display: none;
            opacity: 0;
            height: 0;
            overflow: hidden;
            transition: opacity .8s, height .8s;
            z-index: 6;
        }
        #photo-box.open { display: block; }
        #photo-box > div {
            background-color: rgba(20, 20, 20, 0.4);
            border-radius: 5px;
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 12px 18px;
        }
        #photo-box .photo-box-div {
            margin: 0 4px;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
        }
        #photo-box .photo-box-div.cur .photo-box-p { background-color: rgba(79,140,255,.85); }
        #photo-box .photo-box-img {
            width: 160px;
            height: 96px;
            background-color: #ffffffcc;
            object-fit: cover;
            display: block;
        }
        #photo-box .photo-box-p {
            position: absolute;
            left: 0; bottom: 0;
            text-align: center;
            width: 160px;
            color: #ffffff;
            padding: 2px 0;
            background-color: rgba(20, 20, 20, 0.4);
            font-size: 12px;
        }
        body.no-album #photo-box { display: none !important; }

        /* ===== 展示功能开关 ===== */
        .opt-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 0;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }
        .opt-row input { accent-color: var(--accent); cursor: pointer; }
        .opt-row .sub { color: var(--text-dim); font-size: 11px; }
    </style>
</head>

<body>
    <!-- ===== 侧栏 ===== -->
    <div id="side">
        <div class="logo">TPano <span>全景编辑器</span></div>

        <!-- 全景照片 -->
        <div class="sec">
            <h3>全景照片</h3>
            <div class="btn-row" style="margin-bottom:10px">
                <button class="btn primary" id="btn-add-photo">＋ 添加全景图</button>
            </div>
            <input type="file" id="file-input" accept="image/*,video/mp4,video/webm" multiple style="display:none">
            <div id="photo-list"></div>
            <div class="tip" style="margin-top:10px">当前照片视野 FOV（文档提示：设置不当会黑屏或边缘严重变形，推荐 PC 60 / 手机 90）</div>
            <div class="btn-row" style="margin-top:6px">
                <input type="number" id="fov-pc" min="30" max="110" placeholder="PC 视野角">
                <input type="number" id="fov-phone" min="30" max="110" placeholder="手机视野角">
                <button class="btn" id="btn-fov">应用</button>
            </div>
            <div class="tip">点击列表项切换查看；「添加热点」模式下点击全景图即可放置热点。</div>
        </div>

        <!-- 热点编辑 -->
        <div class="sec">
            <h3>热点</h3>
            <div class="btn-row" style="margin-bottom:10px">
                <button class="btn" id="btn-add-hs">📍 添加热点</button>
            </div>
            <div class="coord" id="coord-tip"></div>
            <div id="hs-list"></div>
        </div>

        <!-- 展示功能（同示例页功能点） -->
        <div class="sec">
            <h3>展示功能（实时预览，随展示页导出）</h3>
            <label class="opt-row"><input type="checkbox" id="opt-rotate"> 镜头自转 <span class="sub">打开后自动旋转，拖拽即停</span></label>
            <label class="opt-row"><input type="checkbox" id="opt-gyro"> 体感控制 <span class="sub">手机陀螺仪，需 https</span></label>
            <label class="opt-row"><input type="checkbox" id="opt-debug"> 调试模式 <span class="sub">控制台输出点击坐标</span></label>
            <label class="opt-row"><input type="checkbox" id="opt-load"> 加载动画 <span class="sub">切换照片时显示进度条</span></label>
            <label class="opt-row"><input type="checkbox" id="opt-album"> 底部相册栏 <span class="sub">横向缩略图快速切换</span></label>
            <label class="opt-row"><input type="checkbox" id="opt-bar"> 右侧功能栏 <span class="sub">6 秒无操作自动隐藏</span></label>
        </div>

        <!-- 导入导出 -->
        <div class="sec" style="flex:1">
            <h3>配置</h3>
            <div class="btn-row">
                <button class="btn" id="btn-export">导出 JSON</button>
                <button class="btn" id="btn-import">导入 JSON</button>
                <button class="btn" id="btn-export-html">导出展示页</button>
            </div>
            <input type="file" id="json-input" accept=".json" style="display:none">
            <div class="tip">
                · 配置会自动保存到浏览器，刷新不丢失<br>
                · 本地选择的图片刷新后需重新添加<br>
                · 「导出展示页」生成单文件 HTML，脚本和图片全部内嵌，发给任何人双击即可打开
            </div>
        </div>
    </div>

    <!-- ===== 画布 ===== -->
    <div id="stage">
        <div id="pano"></div>
        <div id="pano-mode-tip">添加热点模式：在全景图上点击要放置热点的位置</div>
        <button class="btn" id="exit-preview">← 退出预览</button>

        <!-- 加载动画（同示例页） -->
        <div id="load">
            <div id="load-bar-k"><div id="load-bar-x"></div></div>
        </div>

        <!-- 右侧悬浮功能栏（同示例页） -->
        <div id="controller-y">
            <div id="c-photo" class="item item-f" title="相册">
                <img src="./example/img/bar/photo.png" alt="相册">
                <div class="point"></div>
            </div>
            <div id="c-gyro" class="item item-f" title="体感控制">
                <img src="./example/img/bar/gyro.png" alt="体感">
                <div class="point"></div>
            </div>
            <div id="c-rotate" class="item item-f" title="镜头自转">
                <img alt="自转" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2.2' stroke-linecap='round'%3E%3Cpath d='M21 12a9 9 0 1 1-2.64-6.36'/%3E%3Cpath d='M21 3v6h-6'/%3E%3C/svg%3E">
                <div class="point"></div>
            </div>
            <div id="c-hide" class="item item-s" title="隐藏功能键">
                <img src="./example/img/bar/function.png" alt="功能">
            </div>
        </div>

        <!-- 底部相册栏（同示例页） -->
        <div id="photo-box">
            <div id="photo-box-list"></div>
        </div>
    </div>

    <!-- ===== 热点弹窗 ===== -->
    <div id="mask">
        <div id="modal">
            <h3>设置热点</h3>
            <div class="field">
                <label>跳转目标（点击热点后切换到的全景图）</label>
                <select id="m-jump"></select>
            </div>
            <div class="field">
                <label>热点图标</label>
                <div class="icon-grid" id="m-icons"></div>
            </div>
            <div class="field" id="m-custom-wrap" style="display:none">
                <label>自定义图标 URL</label>
                <input type="text" id="m-custom" placeholder="https://... 或 ./path/icon.png">
            </div>
            <div class="foot">
                <button class="btn" id="m-cancel">取消</button>
                <button class="btn primary" id="m-ok">确定添加</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script src="./example/three.min.js"></script>
    <script src="./dist/tpano.js"></script>
    <script src="./example/DeviceOrientationControls.js"></script>
    <script>
        //==================== 状态 ====================
        var photos = [];      // {name, url, isBlob, isVideo, fov}
        var hotspots = [];    // {source, position:{x,y,z}, imgUrl, jumpTo}
        var currentIdx = 0;
        var tpano = null;
        var addMode = false;          // 添加热点模式
        var pendingPoint = null;      // 待确认的坐标
        // 展示功能开关（与示例页功能点一一对应，实时预览 + 随展示页导出）
        var opts = { rotate: true, gyro: false, debug: false, load: true, album: true, bar: true };

        var ICONS = [
            './example/img/foot.png',
            './example/img/outdoor.gif',
            './example/img/bar/photo.png',
            './example/img/bar/gyro.png'
        ];

        //==================== 工具 ====================
        function $(id) { return document.getElementById(id); }
        function toast(msg) {
            var t = $('toast');
            t.textContent = msg;
            t.style.display = 'block';
            clearTimeout(t._timer);
            t._timer = setTimeout(function () { t.style.display = 'none'; }, 2200);
        }
        function thumbOf(url) {
            return url.toLowerCase().match(/\.(gif|jfif)$/) ? url : url;
        }

        //==================== TPano 初始化 / 重建 ====================
        function buildConfig() {
            return {
                el: 'pano',
                photo: photos.map(function (p) {
                    var item = { url: p.url, name: p.name };
                    if (p.isVideo) item.type = 'VIDEO';
                    if (p.fov) item.fov = p.fov;
                    return item;
                }),
                hotspot: hotspots.slice(),
                MouseController: true,
                rotateAnimateController: opts.rotate,
                DeviceOrientationControls: opts.gyro,
                debug: opts.debug,
                lazyLoad: true, //按需加载，避免全量预下载拖慢打开速度
                gyroSport: function (e) {
                    if (!e && !gyroMsgShown) {
                        gyroMsgShown = true;
                        toast('设备可能不支持陀螺仪，或未启用 https。多数浏览器安全策略只对 https 网站提供陀螺仪服务。');
                    }
                },
                positionClick: onPositionClick,
                switchLoad: function (e) {
                    if (e && e.loading) {
                        currentIdx = e.loading.id - 1;
                        renderPhotoList();
                        renderHsList();
                        updateFovInputs();
                        renderAlbumCur();
                    }
                    if (opts.load) {
                        if (e && e.status === 'loading') loadAnimate();
                        else if (e && e.status === 'end') closeLoadAnimate();
                    }
                },
                photoLoad: function (e) {
                    if (opts.load) closeLoadAnimate();
                    // 首图就绪：构建相册栏并启动功能栏自动隐藏（同示例页）
                    if (!albumBuilt && photos.length) {
                        albumBuilt = true;
                        buildAlbum();
                        if (opts.bar) scheduleBarHide();
                    }
                }
            };
        }

        function rebuild() {
            var el = $('pano');
            el.innerHTML = '';
            albumBuilt = false;
            if (photos.length === 0) { tpano = null; return; }
            currentIdx = Math.min(currentIdx, photos.length - 1);
            tpano = new TPano(buildConfig());
            //懒加载模式：目标照片未加载时框架会按需加载并自动重试，直接切换即可
            if (currentIdx > 0) tpano.re.switchPhoto(currentIdx + 1);
        }

        //==================== 画布区展示功能（同示例页） ====================
        var gyroMsgShown = false;   // gyroSport 提示只弹一次
        var albumBuilt = false;     // 相册栏是否已构建
        var barHidden = false;      // 功能栏是否处于收起状态
        var barHideTimer = null;

        //---- 加载动画 ----
        function loadAnimate() {
            var bar = $('load-bar-x'), box = $('load');
            box.style.display = 'flex';
            bar.style.animation = 'none';
            bar.style.transition = 'none';
            bar.style.width = '0%';
            // 强制回流后恢复过渡动画
            void bar.offsetWidth;
            bar.style.transition = 'width 15s linear';
            bar.style.width = '99%';
        }
        function closeLoadAnimate() {
            var bar = $('load-bar-x');
            bar.style.animation = 'none';
            bar.style.transition = 'width 1s linear';
            bar.style.width = '100%';
            setTimeout(function () { $('load').style.display = 'none'; }, 1100);
        }

        //---- 底部相册栏 ----
        function buildAlbum() {
            var box = $('photo-box-list');
            box.innerHTML = '';
            photos.forEach(function (p, i) {
                var div = document.createElement('div');
                div.className = 'photo-box-div';
                var img = document.createElement('img');
                img.className = 'photo-box-img';
                img.src = p.isVideo ? './example/video.png' : (p.thumb || p.url);
                var name = document.createElement('p');
                name.className = 'photo-box-p';
                name.textContent = p.name;
                div.appendChild(img);
                div.appendChild(name);
                div.onclick = function () {
                    if (!tpano) return;
                    var r = tpano.re.switchPhoto(i + 1);
                    if (r && r.status !== 'OK') toast(r.msg || '切换失败');
                };
                box.appendChild(div);
            });
            renderAlbumCur();
        }
        function renderAlbumCur() {
            var kids = $('photo-box-list').children;

        // 把任意图片地址（blob: / 相对路径 / http）转成可独立打开的 data URL；失败时原样返回
        function toDataURL(url) {
            return fetch(url).then(function (r) {
                if (!r.ok) throw new Error('bad');
                return r.blob();
            }).then(function (blob) {
                return new Promise(function (res, rej) {
                    var fr = new FileReader();
                    fr.onload = function () { res(fr.result); };
                    fr.onerror = rej;
                    fr.readAsDataURL(blob);
                });
            }).catch(function () { return url; });
        }

        // 防止脚本或配置内容里出现 script 结束标签，导致内联脚本被提前截断
        function safeEmbed(s) {
            return s.replace(/<\/(script)/gi, '<\\/$1');
        }

        // 用 canvas 生成 320x160 缩略图 data URL（用于导出时替换相册栏原图，大幅减小体积）
        function makeThumb(url) {
            return new Promise(function (res) {
                var img = new Image();
                img.onload = function () {
                    try {
                        var c = document.createElement('canvas');
                        var W = 320, H = 160;
                        c.width = W; c.height = H;
                        var ctx = c.getContext('2d');
                        // 等比缩放居中裁剪为 2:1
                        var s = Math.max(W / img.width, H / img.height);
                        var w = img.width * s, h = img.height * s;
                        ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
                        res(c.toDataURL('image/jpeg', 0.7));
                    } catch (e) { res(null); }
                };
                img.onerror = function () { res(null); };
                img.src = url;
            });
        }

                    }
                }

                // 4. 组装运行时（TPano 实例在展示页内联创建，回调直接驱动各功能模块）
                var callbacksJs = 'var gyroOn=' + opts.gyro + ',rotateOn=' + opts.rotate + ';\n'
                    + 'function setGyro(on){gyroOn=on;tpano.re.switchGyro(on);var pt=document.querySelector("#v-gyro .point");if(pt)pt.style.display=on?"block":"none";}\n'
                    + 'function setRotate(on){rotateOn=on;tpano.re.switchRotate(on);var pt=document.querySelector("#v-rotate .point");if(pt)pt.style.display=on?"block":"none";}\n'
                    + 'window.addEventListener("resize",function(){tpano.re.resizeRendererToDisplaySize(window.innerWidth,window.innerHeight);});\n'
                    + 'var tpano=new TPano({\n'
                    + 'el:"pano",\n'
                    + 'lazyLoad:true,\n'
                    + 'photo:PHOTOS,\n'
                    + 'hotspot:HOTSPOTS,\n'
                    + 'rotateAnimateController:' + opts.rotate + ',\n'
                    + 'DeviceOrientationControls:' + opts.gyro + ',\n'
                    + 'debug:' + opts.debug + ',\n'
                    + 'gyroSport:function(e){if(!e&&!gyroMsg){gyroMsg=true;alert("设备可能不支持陀螺仪,或者您没有启用https。多数浏览器安全策略只对启用了https的网站提供陀螺仪服务。");}},\n'
                    + 'switchLoad:function(e){'
                    + (opts.load ? 'if(e.status==="loading"){loadAnimate();}else if(e.status==="end"){closeLoadAnimate();}else{alert("加载出错");}' : 'if(e.status!=="loading"&&e.status!=="end"){alert("加载出错");}')
                    + (opts.album ? 'renderAlbumCur(e.loading.id-1);' : '')
                    + '},\n'
                    + 'photoLoad:function(e){' + (opts.load ? 'closeLoadAnimate();' : '') + '}\n'
                    + '});\n';

                var html = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n'
                    + '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n'
                    + '<title>TPano 全景漫游</title>\n<style>\n' + css + '</style>\n</head>\n'
                    + '<body id="pano">\n' + chromeHtml + '</body>\n'
                    + '<script>\n' + safeEmbed(texts[0]) + '\n<\/script>\n'
                    + '<script>\n' + safeEmbed(texts[1]) + '\n<\/script>\n'
                    + '<script>\n' + safeEmbed(texts[2]) + '\n<\/script>\n'
                    + '<script>\nvar PHOTOS=' + JSON.stringify(photoCfg).replace(/</g, '\\u003c') + ';\n'
                    + 'var HOTSPOTS=' + JSON.stringify(hsCfg).replace(/</g, '\\u003c') + ';\n'
                    + 'var VIDEOICON=' + JSON.stringify(iconVideo) + ';\n'
                    + safeEmbed(chromeJs)
                    + '\n' + safeEmbed(callbacksJs)
                    + '\n<\/script>\n</html>';
                download('tpano-viewer.html', html);
                toast('单文件展示页已导出（' + Math.round(totalSize / 1048576) + 'MB 媒体已内嵌），双击即可打开');
            } catch (e) {
                toast('导出失败：' + e.message);
            }
        };

        function download(filename, content) {
            var a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([content], { type: 'application/octet-stream' }));
            a.download = filename;
            a.click();
        }

        //==================== 预览模式 ====================
        $('exit-preview').onclick = function () { setPreview(false); };
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                if ($('mask').classList.contains('show')) closeModal();
                else if (document.body.classList.contains('preview')) setPreview(false);
            }
        });
        // 双击画布进入预览
        $('pano').addEventListener('dblclick', function () { setPreview(true); });
        function setPreview(on) {
            document.body.classList.toggle('preview', on);
            if (on) {
                addMode = false;
                $('btn-add-hs').classList.remove('active');
                $('pano-mode-tip').style.display = 'none';
                toast('预览模式：按 Esc 或点击左上角退出');
            }
        }

        //==================== 展示功能开关绑定 ====================
        function applyOptChrome() {
            document.body.classList.toggle('no-bar', !opts.bar);
            document.body.classList.toggle('no-album', !opts.album);
            if (!opts.load) $('load').style.display = 'none';
            if (!opts.bar) {
                // 关闭功能栏时复位为展开态，下次开启时正常显示
                if (barHidden) toggleBarHide();
            }
        }

        $('opt-rotate').onchange = function () { setRotate(this.checked); };
        $('opt-gyro').onchange = function () { setGyro(this.checked); };
        $('opt-debug').onchange = function () {
            opts.debug = this.checked;
            rebuild(); // debug 在框架初始化时读取，需重建实例
            save();
        };
        $('opt-load').onchange = function () {
            opts.load = this.checked;
            if (!opts.load) $('load').style.display = 'none';
            save();
        };
        $('opt-album').onchange = function () {
            opts.album = this.checked;
            applyOptChrome();
            save();
        };
        $('opt-bar').onchange = function () {
            opts.bar = this.checked;
            applyOptChrome();
            save();
        };

        function syncOptInputs() {
            $('opt-rotate').checked = opts.rotate;
            $('opt-gyro').checked = opts.gyro;
            $('opt-debug').checked = opts.debug;
            $('opt-load').checked = opts.load;
            $('opt-album').checked = opts.album;
            $('opt-bar').checked = opts.bar;
            $('c-gyro').querySelector('.point').style.display = opts.gyro ? 'block' : 'none';
            $('c-rotate').querySelector('.point').style.display = opts.rotate ? 'block' : 'none';
        }

        //==================== 自动保存 / 恢复 ====================
        function save() {
            try {
                localStorage.setItem('tpano-editor-v2', JSON.stringify({
                    photos: photos.map(function (p) {
                        return {
                            name: p.name,
                            url: p.isBlob ? '' : p.url,
                            thumb: p.thumb || '',
                            isVideo: !!p.isVideo,
                            fov: p.fov || null
                        };
                    }),
                    hotspots: hotspots,
                    opts: opts
                }));
            } catch (e) { }
        }
        (function restore() {
            try {
                var s = JSON.parse(localStorage.getItem('tpano-editor-v2') || 'null');
                if (s && s.photos && s.photos.length) {
                    photos = s.photos.filter(function (p) { return p.url; })
                        .map(function (p) {
                            return { name: p.name, url: p.url, thumb: p.thumb || '', isBlob: false, isVideo: !!p.isVideo, fov: p.fov || null };
                        });
                    hotspots = s.hotspots || [];
                }
                if (s && s.opts) {
                    for (var k in opts) {
                        if (s.opts[k] != null) opts[k] = !!s.opts[k];
                    }
                }
            } catch (e) { }
            // 首次使用时预置示例全景图（panorama_2x1.jpg 为用户实测可用的 2:1 球面全景；thumb 为小缩略图，避免侧栏把原图全量拉下来）
            if (!photos.length) {
                photos = [
                    { name: '办公区', url: './panorama_2x1.jpg', thumb: './thumb-panorama_2x1.jpg', isBlob: false },
                    { name: '示例一', url: './example/pano/DSCN0007.JPG', thumb: './example/pano/thumb-DSCN0007.jpg', isBlob: false },
                    { name: '示例二', url: './example/pano/DSCN0009.JPG', thumb: './example/pano/thumb-DSCN0009.jpg', isBlob: false },
                    { name: '示例三', url: './example/pano/DSCN0013.JPG', thumb: './example/pano/thumb-DSCN0013.jpg', isBlob: false }
                ];
            }
            rebuild();
            syncOptInputs();
            applyOptChrome();
        })();

        // 自适应窗口
        window.addEventListener('resize', function () {
            if (tpano) {
                var el = $('pano');
                tpano.re.resizeRendererToDisplaySize(el.clientWidth, el.clientHeight);
            }
        });
        // 初始视野输入框
        updateFovInputs();
    </script>
</body>

</html>
